<!doctype html>
<html lang="es">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Presentación del proyecto tecnológico inclusivo Toki."
    />
    <title>Toki</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <main class="presentation" aria-label="Presentación de Toki">
      <section class="slide" aria-label="Logo de Toki">
        <img
          src="/src/imports/1.jpg"
          alt="Logo de Toki y lema del proyecto"
          fetchpriority="high"
        />
      </section>

      <section class="slide" aria-label="Quiénes somos">
        <img
          src="/src/imports/2.jpg"
          alt="Presentación del equipo de Toki"
          loading="lazy"
        />
      </section>

      <section class="slide" aria-label="Qué es el TEA">
        <img
          src="/src/imports/3.jpg"
          alt="Información sobre qué es el TEA"
          loading="lazy"
        />
      </section>

      <section class="slide" aria-label="Problemática">
        <img
          src="/src/imports/4.jpg"
          alt="Problemáticas que busca resolver Toki"
          loading="lazy"
        />
      </section>

      <section class="slide" aria-label="Solución">
        <img
          src="/src/imports/5.jpg"
          alt="Toki como solución tecnológica inclusiva"
          loading="lazy"
        />
      </section>

      <section class="slide" aria-label="Contacto">
        <div class="contact-card">
          <img
            src="/src/imports/6.jpg"
            alt="Información de contacto de Toki"
            loading="lazy"
          />

          <a
            class="contact-link email-link"
            href="mailto:toki.tw.empresa@gmail.com"
            aria-label="Enviar un correo electrónico a Toki"
          ></a>

          <a
            class="contact-link tiktok-link"
            href="https://www.tiktok.com/@toki.empresa?is_from_webapp=1&amp;sender_device=pc"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar Toki en TikTok"
          ></a>

          <a
            class="contact-link facebook-link"
            href="https://www.facebook.com/profile.php?id=61593640589549"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar Toki en Facebook"
          ></a>

          <a
            class="contact-link instagram-link"
            href="https://www.instagram.com/toki.empresa?stkn=ZDNlZDc0MzIxNw=="
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visitar Toki en Instagram"
          ></a>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
    <!-- figma:body-end -->
  </body>
</html>
